{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;">
  <h1>Change Password</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
